name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yaml

  publish-node:
    name: Publish Custom Node to registry
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun ci

      - name: Validate release metadata
        run: bun run release:check

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build custom node package
        run: bun run build:custom-node

      - name: Use packaged metadata for Registry upload
        run: |
          archive="$(ls -t build/*.zip | head -n 1)"
          unzip -p "$archive" pyproject.toml > pyproject.toml

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: "true"

  github-release:
    if: github.event_name == 'push'
    name: Build and publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun ci

      - name: Validate tag and build Registry ZIP
        id: build
        run: bun run release:github

      - name: Create GitHub Release and upload ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PATH: ${{ steps.build.outputs.archive }}
        run: |
          gh release create \
            "$GITHUB_REF_NAME" \
            "$ARCHIVE_PATH" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
